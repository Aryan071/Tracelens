[tool.uv.workspace]
members = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["engine/src/tracelens/evidence/models.py"]  # generated

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["tracelens"]
