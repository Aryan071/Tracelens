[tool.uv.workspace]
members = ["engine", "ingest", "indexer", "api", "explainer"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["engine/src/tracelens/evidence/models.py"]  # generated

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "E501", "S608", "S603", "S607", "S311", "S106"]  # asserts, long SQL literals, test-only f-string SQL
"bench/**" = ["S101", "S106", "S310", "S311", "S603", "S607", "S608", "E501"]  # load tool, not shipped code
"scripts/**" = ["E501", "S101"]  # acceptance helpers
"explainer/eval/**" = ["S101", "S311", "E501"]  # evaluation tooling, not shipped code
"explainer/src/tracelens_explain/template.py" = ["E501"]  # prose f-strings
"explainer/src/tracelens_explain/llm.py" = ["E501"]  # the system prompt
"demo/bad-deployments/**" = ["E501", "S603", "S607"]  # source-code string literals; shells out to git
"engine/src/tracelens/cli.py" = ["E501"]  # table-formatting f-strings
"engine/src/tracelens/pipeline.py" = ["E501"]  # report-formatting f-strings
"engine/src/tracelens/loader.py" = ["E501", "S608"]  # SQL literals; the interpolated fragment is a module constant
"engine/src/tracelens/symbols_pg.py" = ["E501"]  # SQL literals
"indexer/src/tracelens_indexer/store.py" = ["E501", "S608"]  # long SQL literals; fragments are constants

[tool.mypy]
explicit_package_bases = true
mypy_path = "engine/src:ingest/src:indexer/src:api/src:explainer/src:engine/tests:explainer/tests"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["tracelens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["engine", "ingest", "indexer", "api", "explainer"]
pythonpath = ["engine/tests", "explainer/tests"]  # lets engine tests import the shared spanfactory helper
markers = ["integration: needs a running ClickHouse (see Makefile test-integration)"]

# grpcio / protobuf ship without inline types; stub packages (types-grpcio,
# types-protobuf) would be extra dependencies, so relax only these imports.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tracelens_ingest.servers", "tracelens_ingest.main", "tests.test_integration", "ingest.tests.test_integration"]
disallow_untyped_calls = false
disallow_subclassing_any = false
