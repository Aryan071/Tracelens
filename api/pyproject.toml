[project]
name = "tracelens-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "tracelens-engine",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary]>=3.2",
  "clickhouse-connect>=0.8",
]

[tool.uv.sources]
tracelens-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens_api"]
