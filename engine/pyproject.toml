[project]
name = "tracelens-engine"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "tracelens-indexer",
  "clickhouse-connect>=0.8",
  "psycopg[binary]>=3.2",
]

[tool.uv.sources]
tracelens-indexer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.26",
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
]
