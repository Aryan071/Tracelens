[project]
name = "tracelens-explain"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "tracelens-engine",
  "anthropic>=1.0",
]

[tool.uv.sources]
tracelens-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens_explain"]
