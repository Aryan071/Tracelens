name: tracelens

x-demo: &demo
  build: { context: ., dockerfile: demo/Dockerfile }
  depends_on:
    postgres: { condition: service_healthy }
    ingest: { condition: service_healthy }
  environment: &demo-env
    DATABASE_URL: postgres://tracelens:tracelens@postgres:5432/demo
    TRACE_EXPORTERS: ${TRACE_EXPORTERS:-otlp}   # comma list: otlp, console
    OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:4318
    DEMO_VERSION: ${DEMO_VERSION:-1.0.0}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens
      POSTGRES_DB: demo
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./demo/db/init.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: tracelens
      CLICKHOUSE_USER: tracelens
      CLICKHOUSE_PASSWORD: tracelens
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    ports: ["127.0.0.1:8123:8123"]
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  ingest:
    build: { context: ., dockerfile: ingest/Dockerfile }
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: tracelens
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      INGEST_PROCESSES: ${INGEST_PROCESSES:-2}
      BUFFER_MAX_SPANS: ${BUFFER_MAX_SPANS:-200000}
      BATCH_MAX_SPANS: ${BATCH_MAX_SPANS:-10000}
      INSERT_WORKERS: ${INSERT_WORKERS:-2}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    stop_grace_period: 45s  # > SHUTDOWN_TIMEOUT_S so the buffer drains before SIGKILL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4318/readyz').status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  orders:
    <<: *demo
    command: ["node", "-r", "./dist/tracing.js", "dist/orders.js"]
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: orders
      OTEL_RESOURCE_ATTRIBUTES: service.version=${DEMO_VERSION:-1.0.0}
    ports: ["3001:3001"]

  inventory:
    <<: *demo
    command: ["node", "-r", "./dist/tracing.js", "dist/inventory.js"]
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: inventory
      OTEL_RESOURCE_ATTRIBUTES: service.version=${DEMO_VERSION:-1.0.0}

  payments:
    <<: *demo
    command: ["node", "-r", "./dist/tracing.js", "dist/payments.js"]
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: payments
      OTEL_RESOURCE_ATTRIBUTES: service.version=${DEMO_VERSION:-1.0.0}

  loadgen:
    <<: *demo
    command: ["node", "dist/loadgen.js"]
    depends_on: [orders]
    environment:
      ORDERS_URL: http://orders:3001
      RATE: ${LOAD_RATE:-5}

volumes:
  pgdata:
  chdata:
