name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated types are up to date
        run: make gen-check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy engine/src engine/tests
      - run: uv run pytest engine

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait clickhouse postgres
      - run: make test-integration
      - if: failure()
        run: docker compose logs clickhouse postgres --tail=100

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Typecheck (strict tsc is the lint gate until eslint is approved)
        run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait postgres clickhouse
      - run: docker compose up -d --build
      - run: scripts/smoke.sh
      - if: failure()
        run: docker compose logs --tail=200
